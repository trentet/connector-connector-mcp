- id: REQ-G003
  kind: derived
  status: decided
  title: GitHub merges into main only with a green cc/req-gate status, posted by a W540 service for same-repository pull requests only
  text: >
    The repository is public (REQ-U017), so GitHub rulesets can enforce the gate. A W540 service (scripts/status-poster.mjs,
    run by a scheduled task at logon through helm-host-kit's hidden launcher, E13) polls every open pull request, whatever its base branch. For a pull
    request whose head is a branch of trentet/connector-connector-mcp itself it checks the head commit once and posts the
    commit status cc/req-gate (pending while it runs, then success or failure). A pull request from a fork is never
    fetched or run on the W540; its head gets the failure status "not run" at once. The check (scripts/change-gate.mjs)
    runs, on a worktree of the head commit: (1) the requirement gate scripts/req_gate.py in pre-push mode over the pull
    request's commits (merge-base with main up to the head): commit messages, static ledger, code and test traceability
    and the diff checks of REQ-G001 and REQ-G002; (2) the full test suite as npm test runs it (check:hidden-launch, then
    every vitest test), with v8 coverage; (3) changed-line coverage: of the lines the pull request adds or changes in
    code files (src/, scripts/ and bin/; .ts, .mts, .js, .mjs; not .d.ts), at least 90% of those a statement starts on
    must run in the suite, and a changed code file the suite never loads counts every changed non-blank, non-comment line
    as not run; (4) every test case of a requirement the pull request adds or changes names a test file and a test whose
    title holds the test case id, and that test passed. The check scripts and the coverage tool come from the service's
    own copy of main, never from the head under test. A ruleset on main requires the cc/req-gate status and a pull
    request, blocks force-push and deletion, and has no bypass actor, the owner's admin role included.
  prior_art: >
    Searched 21 Nov 2026 before this entry: every trentet GitHub repository (58, cloned shallow, grepped for commit
    statuses, check runs, self-hosted runners, rulesets and required status checks), HELM rules and the engineering
    standards. Found: (a) helm-rules scripts/ci/status.mjs and merge-lib.mjs post a gate report as a commit status
    ("N problem(s): first problem", 140 characters) from a W540 runner outside GitHub Actions: the pattern is reused
    here, the code is not imported (RULE-280 R-280.2: code is used only as a feature of its own repository).
    (b) patchright-mcp scripts/ci-runner/required-check.ps1 creates a ruleset with required_status_checks through gh:
    the same ruleset shape is used. (c) GitHub Actions on the W540's self-hosted runner (label helm-w540: helm-audio-mcp,
    helm-drive-mcp, helm-vision-mcp, helm-mcp-kit, patchright-mcp): not reused for this repository, because on a public
    repository a fork pull request supplies its own workflow file, so a self-hosted runner could run fork code on the
    W540 (GitHub's own warning on self-hosted runners in public repositories); a service that posts statuses for
    same-repository branches only never runs fork code. (d) helm-secret-connector src/helm_secret/change_gate.py on the
    Forgejo (the change gate of that repository): its rules are mirrored (merge-base diff, changed lines at least 90%
    run, a file never loaded counts as not run, test cases must name real passing tests, the pinned gate copy), its
    code is not copied: HELM SECRET never goes to GitHub (RULE-233 R-233.1) and repositories are silos (RULE-280).
    (e) cc's own scripts/req_gate.py (REQ-G001, REQ-G002) is called as it is, in its pre-push mode. Where it runs:
    engineering standard E12 (CI only on self-hosted machines the operator owns, no money spent).
    On 24 Nov 2026, before changing the poster: searched every trentet GitHub repository tree for run-pull/forgejo-pull (none owns that script) and re-read scripts/status-poster.mjs and test/status-poster.test.ts. plan() and classify() already handle any same-repository or fork pull request; cycle() was the only filter, listing only pulls?state=open&base=main, so stacked same-repository pull requests (for example #99 and #100) never received a cc/req-gate status. This AC extends cycle() in place; it does not add a second poster.
  acceptance:
  - {id: REQ-G003.AC1, text: "The check runs scripts/req_gate.py pre-push over the commits from the merge-base of main and the head up to the head; any problem it reports fails the check with its lines."}
  - {id: REQ-G003.AC2, text: "The check runs check:hidden-launch and the whole vitest suite on the head; a failed test, a failed run, a run with no result or a run with no test fails the check, naming the failed tests."}
  - {id: REQ-G003.AC3, text: "Of the changed lines in code files (src/, scripts/, bin/; .ts .mts .js .mjs; not .d.ts) that a statement starts on, at least 90% must run in the suite; a changed code file the suite never loads counts each changed non-blank, non-comment line as not run; below 90% fails naming each file and its lines not run; a pull request with no changed code line passes this part."}
  - {id: REQ-G003.AC4, text: "Every test case of a requirement the pull request adds or changes names a test file and a test whose title holds the test case id, and that test passed; otherwise the check fails naming the test case. Requirements the pull request leaves unchanged are not re-checked."}
  - {id: REQ-G003.AC5, text: "The result is the commit status cc/req-gate on the head commit: pending while it runs, then success with 'pass: ...' or failure with 'N problem(s): <first problem>', at most 140 characters."}
  - {id: REQ-G003.AC6, text: "Only open pull requests whose head repository is trentet/connector-connector-mcp are fetched and checked; a fork pull request (or one whose head repository is gone) is never fetched or run and gets the failure status 'not run' once."}
  - {id: REQ-G003.AC7, text: "change-gate.mjs and req_gate.py run from the service's copy of main, never from the head; the head's worktree supplies only the code, tests and ledger under test; @vitest/coverage-v8 is installed at the head's vitest version without saving it to the head's package files; the worktree is removed after the check, also after a failure."}
  - {id: REQ-G003.AC8, text: "Each head commit is checked once: a head with a success, failure or error cc/req-gate status is not checked again; a pending status older than 30 minutes (a check cut off) is checked again; a newer push is a new head and is checked."}
  - {id: REQ-G003.AC9, text: "The service writes its PID and start time to state.json and one log line per check (pull request, commit, result); the GitHub token stays inside gh and is never written; the scheduled task starts it hidden through run-hidden.vbs at logon and a watchdog restarts it."}
  - {id: REQ-G003.AC10, text: "Every open pull request is listed, whatever its base branch; a same-repository head is checked even when the pull request does not target main; a fork pull request is still never fetched or run and still gets the not-run failure once."}
