  - {id: REQ-D010.AC5, text: "Once cf-turnstile-response holds a token, Login is pressed with it and the login completes only on grok.com or accounts.x.ai/account by host and path (REQ-D007 kept: never pressed while pending, re-pressed on a fresh token)."}
  - {id: REQ-D010.AC6, text: "When every automated attempt is used and the check is still pending, the login fails at once (before the 10-minute bound) with an error that names the auto-solve wait, the clicks and their methods, the page loads and reloads and the Login presses; it never asks a person to act; the 10-minute bound error lists the same attempts."}
  - {id: REQ-D010.AC7, text: "Every login, passed or failed, reports one step line (mode, human-check outcome, clicks, click methods, reloads, Login presses, confirmed host, waited ms) that a job writes to logs/runs/<job>.log; outside a job nothing is written."}
  - {id: REQ-D010.AC8, text: "Errors and step lines carry the page's origin and path only: never a query string, email, token or password."}
  - {id: REQ-D010.AC9, text: "Everything is bounded: total clicks at most maxClicks x (1 + maxReloads); polling never faster than 500 ms; the real run's Chrome stays headful (REQ-D004 launch flags)."}
  - {id: REQ-D010.AC10, text: "The ledger no longer says cc never clicks the check or that a human at the machine finishes it (REQ-D004, REQ-D007)."}
