- id: REQ-D008
  kind: derived
  status: decided
  title: A job's status follows the work; a failure is reported at once with its exact error, and cleanup is bounded
  text: >
    Root cause of run_86587827120479fd staying "running" for about 17 minutes after its login had failed: the job's status
    was set only after every browser session had closed, and the close had unbounded steps. Now each finished item is
    added to the job at once, and when the work is done the job is ok or error with the exact error before the browsers
    are shut down (phase cleanup); op=status shows status, phase and items right away. Shutdown steps that can hang (CDP
    Browser.close, reading cookies) give up after 10 s. If the cleanup still overruns CC_JOB_CLEANUP_MS (default 90 s),
    the job settles its own recorded PIDs (REQ-D009), releases its account lock and in-flight slot (phase cleanup-timeout),
    so a stuck shutdown can never block the next run. Run logs go to cc's data dir (logs/runs/<job>.log) with ids, ops,
    statuses and PIDs only; tests use their own temp data dir.
  files: [src/core/runJobs.ts, src/core/runner.ts, src/browser/chrome.ts, src/core/types.ts, test/job-processes.test.ts, test/run-jobs.test.ts]
  tools: [cc_run]
  decision: {quote: "It\u2019s absolutely unacceptable to be having work deployed, but not be checking in on it on a regular basis automatically without human intervention", at: '2026-11-15', source: main chat t162u, from: REQ-U012}
- id: REQ-D009
  kind: derived
  status: decided
  title: Every process a job launches is recorded by PID and start time, returned by op=status, and settled by PID at the end
  text: >
    On 15 Nov 2026 nothing tied a process on the shared host to a cc job: the cc server had no children, and a Chrome on
    cc's lane-0 port with a cc-run-* profile turned out to belong to the page-backups tool, which opens browsers through
    cc's own openSession from the deployed copy (so it shares cc's lane locks, ports and profile naming by design). Each
    process a job launches (a run's Chrome or the REQ-D006 desktop helper, and the cookie-merge Chrome) is recorded in
    the job state with the job id, PID, OS start time, spawn time, kind, CDP port, user-data-dir, cache dir and lane;
    op=status returns them with the cc server's own PID. At job end each recorded process is confirmed exited, or exactly
    that PID and its tree are killed and its exit confirmed. A PID that now has another start time is someone else's
    and is left alone; one whose start time was never read is not killed. Nothing is ever matched or killed by name,
    port or folder. Processes started outside a job (page-backups, the CLI's seed and sign-in) are not attributed to one.
