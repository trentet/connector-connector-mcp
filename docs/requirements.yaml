- id: REQ-D010
  kind: derived
  status: decided
  title: Grok email login gets past the Cloudflare human check by itself (auto-solve wait, then cc clicks the checkbox, then reloads); no person is ever needed
  text: >
    Amends REQ-D004 and REQ-D007 (15 Nov 2026). The operator must never have to click the human check; cc gets through
    it by itself in its headful Chrome. On grok.com's email-and-password sign-in page, after the form is filled, cc reads
    the check's state from Turnstile's own form field (input name cf-turnstile-response, REQ-D007). While the check is
    pending, cc first waits a short auto-solve window (default 10 s) without touching it. If it is still pending, cc
    clicks the Turnstile checkbox itself, the way a person would (in order: the checkbox inside the
    challenges.cloudflare.com frame; else the widget's iframe element; else a mouse click at the checkbox position of
    the widget box that holds cf-turnstile-response), then waits a retry window (default 10 s) for a pass, at most 3
    clicks per page load. If it is still pending after those clicks, cc reloads the sign-in page, fills the same vault
    login again (same account and method checks), and repeats, at most 2 reloads. As soon as cf-turnstile-response holds
    a token, Login is pressed and confirmed exactly as REQ-D007 says (fresh token or 20 s re-press, at most 4 presses
    per page load; done only on grok.com or accounts.x.ai/account by host and path). Only when every automated attempt
    is used and the check is still pending does the job end, at once and not at the 10-minute bound, as failed with an
    exact error naming each way tried and its result (auto-solve wait, clicks with their methods, page loads and
    reloads, Login presses) and the page's origin and path only. It never waits for a person and no error or log asks a
    person to act. The 10-minute bound still caps the whole login and its error lists the same attempts. Each login,
    passed or failed, writes one step line to the job's run log (logs/runs/<job>.log): mode, human-check outcome,
    clicks, click methods, reloads, Login presses, confirmed host and waited ms; never an email, URL, query string,
    token or password. Precedent reused: cc's own click of v0.2.17 (5a0b4b8, clickTurnstileOnce), and the HELM rule
    that a human check is never a reason to stop and needs at least three different attempts with results
    (helm-report-templates scripts/lib/human-check.mjs, RPT-BLD-060).
  acceptance:
  - {id: REQ-D010.AC1, text: "While the check is pending, cc waits the auto-solve window without clicking; a check that passes inside it is never clicked and Login is pressed with that token (outcome auto-solved, clicks 0); a page with no check is never clicked."}
  - {id: REQ-D010.AC2, text: "A check still pending after the auto-solve window is clicked by cc itself, then retried after the retry window, at most maxClicks (3) clicks per page load; a check that has passed is never clicked; a click that fails or finds nothing is counted and the loop goes on."}
  - {id: REQ-D010.AC3, text: "The click tries, in order, the checkbox inside the challenges.cloudflare.com frame, the widget iframe element, and a mouse click at the checkbox position of the box holding cf-turnstile-response, and reports which method worked; with no widget it reports clicked false and clicks nothing."}
  - {id: REQ-D010.AC4, text: "A check still pending after maxClicks clicks on a page load makes cc reload the sign-in page and refill the form, at most maxReloads (2) times; no reload happens before the clicks of that load are used; a reload that throws is counted and the loop goes on."}
  - {id: REQ-D010.AC5, text: "Once cf-turnstile-response holds a token, Login is pressed with it and the login completes only on grok.com or accounts.x.ai/account by host and path (REQ-D007 kept: never pressed while pending, re-pressed on a fresh token)."}
  - {id: REQ-D010.AC6, text: "When every automated attempt is used and the check is still pending, the login fails at once (before the 10-minute bound) with an error that names the auto-solve wait, the clicks and their methods, the page loads and reloads and the Login presses; it never asks a person to act; the 10-minute bound error lists the same attempts."}
  - {id: REQ-D010.AC7, text: "Every login, passed or failed, reports one step line (mode, human-check outcome, clicks, click methods, reloads, Login presses, confirmed host, waited ms) that a job writes to logs/runs/<job>.log; outside a job nothing is written."}
  - {id: REQ-D010.AC8, text: "Errors and step lines carry the page's origin and path only: never a query string, email, token or password."}
  - {id: REQ-D010.AC9, text: "Everything is bounded: total clicks at most maxClicks x (1 + maxReloads); polling never faster than 500 ms; the real run's Chrome stays headful (REQ-D004 launch flags)."}
  - {id: REQ-D010.AC10, text: "The ledger no longer says cc never clicks the check or that a human at the machine finishes it (REQ-D004, REQ-D007)."}
