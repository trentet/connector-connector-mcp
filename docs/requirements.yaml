- id: ACCT-C12
  kind: derived
  status: decided
  title: A vault login's sign-in method is settled when it is pulled; flows check it, never default it
  text: >
    Existing entries stay valid as they are. When cc pulls a vault login for a sign-in (grok.com login, claude.ai
    sign-in through Google, chatgpt.com Continue with Google, connector reauth) it uses the entry's sign_in_method
    when set. When not set, the site's sign-in options come from the vault's per-site record
    (sign-in-options/<site>: site, options, detected_at, source), else from data/selectors/signin-options.json (a
    fixed list, or markers read on the site's own sign-in page). Exactly one option is written to the entry's
    sign_in_method with sign_in_method_source "auto: only option" (the owner-authorized write; a reauth dry run writes
    nothing) and used. Several are stored in the per-site record and the sign-in is refused (ACCOUNT_NOT_AUTHORIZED:
    sign-in method must be chosen) with the options, until the owner sets the entry's sign_in_method to one of them.
    Detection that fails, matches nothing, or reads an unknown method is unknown and refused. The method used must
    equal a method the registry recorded. A flow that can perform only one kind of sign-in checks the recorded method
    against it, as a check and never a default: grok.com's login types into its email-and-password form (email);
    claude.ai sign-in, chatgpt.com and reauth go through Google's own pages (google). Any other recorded method is
    ACCOUNT_MISMATCH.
  files: [src/core/signInMethod.ts, src/core/vaultClient.ts, src/core/accountChoice.ts, src/adapters/grok.ts, src/adapters/chatgpt.ts, src/browser/signin.ts, src/core/reauth.ts, data/selectors/signin-options.json]
  tools: [cc_run, cc_signin, cc_reauth]
  decision: {quote: "OK so you need to make sure that it\u2019s actually going to allow everything to exist as it is but in the future if someone wants to pull the account from the vault, it has to check to see if that value is populated regarding what mode it is or what kind of like login and type it is. If it\u2019s not then it\u2019s required to then determine what\u2019s even available. If for example, there is only one sign in type option available then it can just go ahead and answer it by itself and populate that. But if there\u2019s multiple logins available, then it needs to be keeping track of what those options are and then it needs to be storing that in association with that particular website and then the login credential vault would have to have some kind of correspondence regarding which login method it\u2019s using for that particular set of credentials.", at: '2026-11-11', source: main chat t124u, from: REQ-U008}
