- id: ACCT-C14
  kind: derived
  status: decided
  title: Signed-out sessions may be signed in with the vault login, then are re-verified before acting
  text: >
    When a platform browser session opens and the signed-in account cannot be read, and that platform provides an
    ensureSignedIn flow, cc signs in with the vault login for the run's account (method from ACCT-C13; grok.com's
    flow types into its email-and-password form and therefore requires method email) and then re-reads the session.
    assertSameIdentity still runs before any adapter acts: the email must be the run account, and the method must
    match when one is expected. The runner never calls ensureSignedIn when a signed-in email was already read, so a
    Google (or otherwise wrong-method) session, or a different account, is refused and not overwritten. After a
    successful sign-in, refreshed grok.com sign-in cookies may merge back to the account's master profile. No
    authorization-registry entry is required to type the vault login when none exists (ACCT-C02 still requires
    agreement when an entry is present). Secrets are never returned.
