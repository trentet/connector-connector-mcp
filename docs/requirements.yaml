- id: REQ-D005
  kind: derived
  status: decided
  title: MCP and the CLI share a file lock per account, with stale-lock recovery
  text: >
    A non-dry-run start that opens a browser takes a file lock in cc's data dir (locks/run-<account>.lock)
    so the MCP server and the CLI cannot stack runs for the same account in different processes.
    The lock file records pid, time, account id and op only: never emails, URLs, tokens or passwords.
    A lock whose pid is dead, or that is older than 45 minutes, is treated as stale, removed, and
    the start is allowed. A live lock held by another process refuses the new start and does not
    open a browser. Within one process, REQ-D003 still returns the existing job_id. dry_run does
    not take this lock.
