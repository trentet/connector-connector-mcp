- id: REQ-U003
  kind: user
  status: decided
  scope: universal
  date: '2026-11-11'
  source: main chat t113u 2026-11-11 (owner, verbatim)
  quotes:
  - "It\u2019s absolutely unacceptable for this to ever happen again. You must never under any circumstances ever use an account or log into an account if you have not already been explicitly fucking told as to what you should be using when there\u2019s more than one fucking account available. This must be programmatically and determinist enforced in such a way that makes it impossible for you to make this mistake ever again for anything ever"
  implemented_by: [ACCT-001, ACCT-002, ACCT-003]
- id: REQ-U004
  kind: user
  status: decided
  scope: universal
  date: '2026-11-11'
  source: main chat t114u 2026-11-11 (owner, verbatim; refines REQ-U003)
  quotes:
  - "The Grok account that we are currently on is the only one that should be getting used by default. Effectively when we are dealing with accounts, we first check what account we are already on and then that\u2019s the one that we assume unless we are explicitly told otherwise."
  superseded_by: REQ-U005
  note: REQ-U005 (t119u) replaces the default of using the account already signed in; nothing implements this default any more.
  implemented_by: []
- id: REQ-U005
  kind: user
  status: decided
  scope: universal
  date: '2026-11-11'
  source: main chat t119u 2026-11-11 (owner, verbatim; corrects REQ-U004)
  quotes:
  - "The connector connector is required to be actually using the very specific accounts for each platform based off of the specific accounts that are actually going to be used for that run. So if we have a script that has a fucking schedule where we have specific accounts being defined as being used and passed in and being provided somehow then yes we would do that. But like it would not be acceptable to just be blindly using the accounts that are already logged in without validating that we\u2019re actually logged into the correct account. That\u2019s how you end up with catastrophic problems otherwise like imagine accidentally checking out on Amazon for $7000 purchase and then it\u2019s on the wrong fucking account that\u2019s fucking disastrous like shit like that is never ever acceptable for us to have any height of lack of safeguards"
  implemented_by: [ACCT-001, ACCT-002, ACCT-003]
