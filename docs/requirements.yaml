- id: REQ-D007
  kind: derived
  status: decided
  title: Grok email login presses Login after the human check passes and confirms grok.com
  text: >
    Root cause of the 15 Nov 2026 failure (run_86587827120479fd, screenshot 2026-11-15T16-19-47-231Z-grok-login-FAILED.png):
    Login was pressed while the Cloudflare check was still pending, so the form did not submit; the check then passed on
