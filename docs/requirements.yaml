  - {id: TC-D017-09, ac: REQ-D017.AC4, kind: edge, test: "test/grok-connected-list.test.ts > TC-D017-09 the marker, the button patterns and the detail patterns are data in data/selectors/grok.json"}
  - {id: TC-D017-10, ac: REQ-D017.AC3, kind: edge, test: "test/grok-connected-list.test.ts > TC-D017-10 an empty page is an error, never an empty list, and polling is 500 ms within 30 s"}
  - {id: TC-D017-11, ac: REQ-D017.AC6, kind: positive, test: "test/grok-connected-list.test.ts > TC-D017-11 toolsFromDetail returns the tool names between the tools line and See more"}
  - {id: TC-D017-12, ac: REQ-D017.AC6, kind: edge, test: "test/grok-connected-list.test.ts > TC-D017-12 the tool list also ends at See less or at the end of the dialog and keeps only tool-name lines"}
