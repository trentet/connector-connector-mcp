- id: REQ-D008
  kind: derived
  status: decided
  title: A job's status follows the work; a failure is reported at once with its exact error, and cleanup is bounded
  text: >
    Root cause of run_86587827120479fd staying "running" for about 17 minutes after its login had failed: the job's status
    was set only after every browser session had closed, and the close had unbounded steps. Now each finished item is
    added to the job at once, and when the work is done the job is ok or error with the exact error before the browsers
    are shut down (phase cleanup); op=status shows status, phase and items right away. Shutdown steps that can hang (CDP
    Browser.close, reading cookies) give up after 10 s. If the cleanup still overruns CC_JOB_CLEANUP_MS (default 90 s),
    the job settles its own recorded PIDs (REQ-D009), releases its account lock and in-flight slot (phase cleanup-timeout),
    so a stuck shutdown can never block the next run. Run logs go to cc's data dir (logs/runs/<job>.log) with ids, ops,
    statuses and PIDs only; tests use their own temp data dir.
  files: [src/core/runJobs.ts, src/core/runner.ts, src/browser/chrome.ts, src/core/types.ts, test/job-processes.test.ts, test/run-jobs.test.ts]
