    at the machine and can never take the keyboard focus. The CDP port, the profile copy, the lane, the lean flags and the
    below-normal priority are unchanged, and shutdown still ends the whole process tree of the child. Without the variable
    (the default), on other systems, and for any other value, nothing changes: Chrome is started exactly as REQ-D004 says
