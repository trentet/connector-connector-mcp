  status: decided
  title: A run's Chrome can start on its own Windows desktop, so it shows no window and never takes the focus (opt-in)
  text: >
    When CC_CHROME_DESKTOP=own is set on Windows, launchChrome does not start chrome.exe itself. It starts a small
    PowerShell helper (scripts/start-on-desktop.ps1) with windowsHide true; the helper creates a Windows desktop of the
