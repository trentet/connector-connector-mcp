# Requirements ledger for connector-connector-mcp (cc): the account authorization rule (2026-11-11) and the gate that enforces it.
# Scope (owner t117u, 2026-11-11): only the new account-rule work and the files it adds or changes. Existing
# behaviour is not backfilled here; gate.code and gate.tools_in_scope list exactly what this ledger covers.
gate:
  id_pattern: '\b(?:REQ-[UDG]\d{3}|ACCT-(?:\d{3}|[PCV]\d{2}))\b'
  code: ['^src/core/signInMethod\.ts$', '^src/core/accountChoice\.ts$', '^src/core/accountRegistry\.ts$', '^src/core/accounts\.ts$', '^src/core/vaultClient\.ts$', '^src/adapters/grok\.ts$', '^src/browser/googleConsent\.ts$', '^src/cli\.ts$', '^src/server/app\.ts$', '^src/core/runner\.ts$', '^src/adapters/grokLoginWait\.ts$', '^src/core/runJobs\.ts$', '^src/core/jobProcs\.ts$', '^src/browser/chrome\.ts$', '^src/browser/identity\.ts$', '^src/browser/signin\.ts$', '^src/adapters/types\.ts$', '^src/browser/seed\.ts$', '^scripts/req_gate\.py$', '^scripts/hooks/[^/.]+$']
  tests: ['^test/.+\.ts$']
  tool_files: ['^src/server/app\.ts$']
  tools_in_scope: [cc_signin, cc_run, cc_reauth]
requirements:
